name: OpenAPI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated OpenAPI artifacts
        run: bun run openapi:check

      - name: Detect breaking API changes
        run: bun run openapi:diff
