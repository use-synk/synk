name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/synk_ai?schema=public"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        # @synk-ai/web is excluded: it has no real tests and its static-generation
        # phase requires a live database connection (via @synk-ai/db) that is not
        # available in CI. The turbo test task already handles building each
        # package and its dependencies before running tests.
        run: bun run test --filter=!@synk-ai/web
